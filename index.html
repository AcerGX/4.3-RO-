<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя биография</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }
        header img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
        }
        section {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #4e73df;
        }
        .skills span {
            display: inline-block;
            background: #1cc88a;
            color: white;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 20px;
            font-size: 14px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #2e2e2e;
            color: white;
        }
        a {
            color: #4e73df;
            text-decoration: none;
        }
    </style>
</head>
<body>

<header>
    <img src=https://klev.club/art/anime/7717-arty-anime-tjan-milye-48-foto.htmlalt="Фото">
    <h1>Нурсултан</h1>
    <p>простой парень</p>
</header>

<section>
    <h2>Обо мне</h2>
    <p>
        Привет,пока
    </p>
</section>

<section>
    <h2>Образование</h2>
    <p><strong>2026</strong>колледж политех</p>
    <p>Программное обеспечение</p>
</section>

<section>
    <h2>Навыки</h2>
    <div class="skills">
        <span>HTML</span>
        <span>CSS</span>
    </div>
</section>

<section>
    <h2>Контакты</h2>
    <p>GitHub: <a href="#">github.com/AcerCx</a></p>
</section>

<footer>
    Нурсултан
</footer>

</body>
</html>
